[script://$SPLUNK_HOME/etc/apps/TA-authid/bin/authid_events.py]
interval = 600
index = main
sourcetype = authid:status
source = status
disabled = 0
python.version = python3
python.required = 3.9,3.13,3.14

[script://$SPLUNK_HOME/etc/apps/TA-authid/bin/authid_metrics.py]
interval = 600
index = metrics
sourcetype = authid:metrics
source = metrics
disabled = 0
python.version = python3
python.required = 3.9,3.13,3.14

[script://$SPLUNK_HOME/etc/apps/TA-authid/bin/license_beacon.py]
interval = 3600
index = main
sourcetype = ta_license:status
source = ta_license
disabled = 0
python.version = python3
python.required = 3.9,3.13,3.14
